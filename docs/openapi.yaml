          application/json:
            schema:
              $ref: '#/components/schemas/BoardConnectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardConnectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardConnectionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardConnection'
          description: ''
  /api/v1/boards/{board_pk}/connections/{id}/:
    get:
      operationId: boards_connections_retrieve
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board connection.
        required: true
      tags:
      - boards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardConnection'
          description: ''
    patch:
      operationId: boards_connections_partial_update
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board connection.
