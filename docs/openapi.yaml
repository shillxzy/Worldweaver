openapi: 3.0.3
info:
  title: Worldweaver API
  version: 1.0.0
  description: Локальний API для письменницького простору Worldweaver.
paths:
  /api/v1/ai/status/:
    get:
      operationId: ai_status_retrieve
      tags:
      - ai
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/analysis/:
    get:
      operationId: analysis_list
      parameters:
      - in: query
        name: book
        schema:
          type: integer
      - in: query
        name: chapter
        schema:
          type: integer
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - book
          - book_with_lore
          - chapter
          - consistency
          - fragment
        description: |-
          * `consistency` - Детерміновані перевірки світу
          * `fragment` - Глибокий аналіз фрагмента
          * `chapter` - Глибокий аналіз розділу
          * `book` - Глибокий аналіз книги
          * `book_with_lore` - Книга з урахуванням лору світу
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - failed
          - pending
          - running
        description: |-
          * `pending` - Очікує
          * `running` - Виконується
          * `completed` - Завершено
          * `failed` - Помилка
          * `cancelled` - Скасовано
      - in: query
        name: world
        schema:
          type: integer
      tags:
      - analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnalysisJobList'
          description: ''
    post:
      operationId: analysis_create
      tags:
      - analysis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisJobRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalysisJobRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalysisJobRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
          description: ''
  /api/v1/analysis/{id}/:
    get:
      operationId: analysis_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this analysis job.
        required: true
      tags:
      - analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
          description: ''
  /api/v1/analysis/{id}/cancel/:
    post:
      operationId: analysis_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this analysis job.
        required: true
      tags:
      - analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
          description: ''
  /api/v1/analysis/{id}/results/:
    get:
      operationId: analysis_results_list
      parameters:
      - in: query
        name: book
        schema:
          type: integer
      - in: query
        name: chapter
        schema:
          type: integer
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this analysis job.
        required: true
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - book
          - book_with_lore
          - chapter
          - consistency
          - fragment
        description: |-
          * `consistency` - Детерміновані перевірки світу
          * `fragment` - Глибокий аналіз фрагмента
          * `chapter` - Глибокий аналіз розділу
          * `book` - Глибокий аналіз книги
          * `book_with_lore` - Книга з урахуванням лору світу
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - failed
          - pending
          - running
        description: |-
          * `pending` - Очікує
          * `running` - Виконується
          * `completed` - Завершено
          * `failed` - Помилка
          * `cancelled` - Скасовано
      - in: query
        name: world
        schema:
          type: integer
      tags:
      - analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFindingList'
          description: ''
  /api/v1/analysis/findings/:
    get:
      operationId: analysis_findings_list
      description: Author decisions on findings. Findings never modify the manuscript.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - confirmed
          - insufficient_data
          - potential
          - unverified
        description: |-
          * `confirmed` - Формально підтверджена невідповідність
          * `potential` - Потенційна семантична суперечність
          * `insufficient_data` - Недостатньо даних
          * `unverified` - Неперевірене припущення моделі
      - in: query
        name: chapter
        schema:
          type: integer
      - in: query
        name: decision
        schema:
          type: string
          enum:
          - accepted
          - ignored
          - new
          - rejected
        description: |-
          * `new` - Нове
          * `accepted` - Прийняте
          * `rejected` - Відхилене
          * `ignored` - Проігнороване
      - in: query
        name: job
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - error
          - info
          - warning
        description: |-
          * `info` - Інформація
          * `warning` - Попередження
          * `error` - Помилка
      - in: query
        name: source
        schema:
          type: string
          enum:
          - ai
          - rules
          - text
        description: |-
          * `rules` - Детерміновані правила
          * `text` - Текстові евристики
          * `ai` - Локальна модель
      - in: query
        name: world
        schema:
          type: integer
      tags:
      - analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFindingList'
          description: ''
  /api/v1/analysis/findings/{id}/:
    get:
      operationId: analysis_findings_retrieve
      description: Author decisions on findings. Findings never modify the manuscript.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this finding.
        required: true
      tags:
      - analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
          description: ''
    patch:
      operationId: analysis_findings_partial_update
      description: Author decisions on findings. Findings never modify the manuscript.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this finding.
        required: true
      tags:
      - analysis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFindingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFindingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFindingRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
          description: ''
  /api/v1/analysis/findings/{id}/explain/:
    post:
      operationId: analysis_findings_explain_create
      description: Author decisions on findings. Findings never modify the manuscript.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this finding.
        required: true
      tags:
      - analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Explanation'
          description: ''
  /api/v1/analysis/quick-check/:
    post:
      operationId: analysis_quick_check_create
      description: 'Mode A: cheap, LLM-free checks of the fragment being edited.'
      tags:
      - analysis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickCheckRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuickCheckRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuickCheckRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the ``csrftoken`` cookie so the SPA can send ``X-CSRFToken``.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: auth_me_destroy
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/avatar/:
    get:
      operationId: auth_me_avatar_retrieve
      description: The current user's private avatar (cropped to a square by the client).
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: auth_me_avatar_create
      description: The current user's private avatar (cropped to a square by the client).
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: auth_me_avatar_destroy
      description: The current user's private avatar (cropped to a square by the client).
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/:
    post:
      operationId: auth_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/boards/:
    get:
      operationId: boards_list
      parameters:
      - in: query
        name: book
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: world
        schema:
          type: integer
      tags:
      - boards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoardList'
          description: ''
    post:
      operationId: boards_create
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/v1/boards/{board_pk}/connections/:
    get:
      operationId: boards_connections_list
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - boards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardConnection'
          description: ''
    post:
      operationId: boards_connections_create
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      tags:
      - boards
      requestBody:
