      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBoardConnectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBoardConnectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBoardConnectionRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardConnection'
          description: ''
    delete:
      operationId: boards_connections_destroy
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board connection.
        required: true
      tags:
      - boards
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/boards/{board_pk}/items/:
    get:
      operationId: boards_items_list
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
