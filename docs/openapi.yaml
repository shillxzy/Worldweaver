        description: A search term.
        schema:
          type: string
      tags:
      - boards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardItem'
          description: ''
    post:
      operationId: boards_items_create
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardItemRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardItem'
          description: ''
  /api/v1/boards/{board_pk}/items/{id}/:
    get:
      operationId: boards_items_retrieve
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board item.
        required: true
      tags:
      - boards
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardItem'
          description: ''
    put:
      operationId: boards_items_update
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board item.
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BoardItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BoardItemRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardItem'
          description: ''
    patch:
      operationId: boards_items_partial_update
      parameters:
      - in: path
        name: board_pk
        schema:
          type: string
          pattern: ^\d{1,18}$
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board item.
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBoardItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBoardItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBoardItemRequest'
      security:
      - cookieAuth: []
      responses:
