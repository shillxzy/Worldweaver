          - $ref: '#/components/schemas/JobStatusEnum'
          readOnly: true
        use_ai:
          type: boolean
        params:
          readOnly: true
        progress:
          type: number
          format: double
          readOnly: true
        progress_message:
          type: string
          readOnly: true
        cancel_requested:
          type: boolean
          readOnly: true
        error_code:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
          description: Ніколи не містить тексту рукопису.
        model_name:
          type: string
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
